<div th:fragment="content" class="container-fluid px-4 px-md-5 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-9">

            <div class="card shadow-sm border-0" style="height: 75vh; display: flex; flex-direction: column;">

                <div class="card-header bg-white p-3 border-bottom">
                    <div class="d-flex align-items-center">
                        <img th:src="${otroUsuario.foto != null ? otroUsuario.foto : '/images/usuarios/default_user_img.jpg'}"
                             alt="Avatar"
                             class="rounded-circle me-3"
                             style="width: 40px; height: 40px; object-fit: cover;">
                        <h5 class="mb-0 fw-bold" th:text="${otroUsuario.nombre}">__OTRO_USUARIO__</h5>
                    </div>
                </div>

                <div class="card-body p-3 p-md-4 d-flex flex-column gap-3 overflow-auto" id="caja-de-chat">

                    <div class="d-flex justify-content-start">
                        <div class="chat-bubble-recibido">
                            <p class="mb-1">¡Hola! ¿Cómo estás?</p>
                            <span class="small text-muted d-block text-end">10:30 AM</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <div class="chat-bubble-enviado">
                            <p class="mb-1">¡Todo bien! ¿Listo para el proyecto?</p>
                            <span class="small text-white-50 d-block text-end">10:31 AM</span>
                        </div>
                    </div>

                </div>

                <div class="card-footer bg-light p-3 border-top">
                    <form id="formulario-chat" class="input-group">
                        <input
                                type="text"
                                id="input-mensaje"
                                class="form-control form-control-lg border-0"
                                placeholder="Escribe tu mensaje aquí..."
                                autocomplete="off"
                                style="box-shadow: none;"
                        />
                        <button class="btn btn-primary" type="submit" id="boton-enviar">
                            <i class="ri-send-plane-fill"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Estas variables solo tienen sentido AQUÍ
        const miIdDeUsuario = [[${session.usuario.id}]];
        const idDelOtroUsuario = [[${otroUsuario.id}]];
        /*]]>*/
    </script>

</div>
