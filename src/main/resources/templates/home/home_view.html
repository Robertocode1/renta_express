<div th:fragment="content" class="container-fluid px-5">
    <section class="hero">
        <div class="hero-icon">
            <i class="fas fa-car"></i>
        </div>
        <h1>Renta de Vehículos</h1>
        <p>Encuentra el vehículo perfecto para tus necesidades</p>
    </section>
    <div class="main-content">
        <section class="search-section">
            <div class="search-grid">
                <div class="search-input">
                    <i class="ri-search-line"></i>
                    <input type="text" placeholder="Buscar en renta de vehículos...">
                </div>

                <div class="location-select">
                    <i class="ri-map-pin-line"></i>
                    <select>
                        <option value="">Todas las ubicaciones</option>
                        <option value="Ciudad de México">Ciudad de México</option>
                        <option value="Guadalajara">Guadalajara</option>
                        <option value="Monterrey">Monterrey</option>
                    </select>
                </div>
            </div>

        </section>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon car">
                    <i class="ri-car-line"></i>
                </div>
                <div class="stat-number">250+</div>
                <div class="stat-label">Vehículos Disponibles</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon users">
                    <i class="ri-user-line"></i>
                </div>
                <div class="stat-number">1,200+</div>
                <div class="stat-label">Usuarios Registrados</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon rating">
                    <i class="ri-star-fill"></i>
                </div>
                <div class="stat-number">4.8</div>
                <div class="stat-label">Calificación Promedio</div>
            </div>
        </section>

        <div class="filters-results">
            <div class="results-count">3 resultados encontrados</div>

            <div class="sort-select">
                <i class="ri-equalizer-line"></i>
                <select>
                    <option>Más relevantes</option>
                    <option>Precio menor</option>
                    <option>Precio mayor</option>
                </select>
            </div>
        </div>

        <div class="vehicles-grid">
            <div class="vehicle-card" th:each="pub : ${publicaciones}">

                <div class="vehicle-image">
                    <a th:href="@{/publicaciones/publicacionView(id=${pub.id})}">

                        <img th:if="${!#lists.isEmpty(pub.imagenes)}"
                             th:src="${pub.imagenes[0].urlImagen}"
                             th:alt="${pub.titulo}">

                        <img th:if="${#lists.isEmpty(pub.imagenes)}"
                             src="/images/publicaciones/auto-placeholder.png"
                             alt="Imagen no disponible">
                    </a>

                    <div class="vehicle-badge">
                        <i class="ri-car-line"></i>
                        <span th:text="${pub.idCategoria.categoria}">renta</span>
                        <hr>
                        <hr>
                        <div class="vehicle-price" th:text="'$' + ${#numbers.formatDecimal(pub.precio, 1, 'COMMA', 2, 'POINT')} + ' / ' + ${pub.idTipoPrecio.tipo}">
                            $0.00/día
                        </div>
                    </div>

                </div>

                <div class="vehicle-content">
                    <h3 class="vehicle-title">
                        <a th:href="@{/publicaciones/publicacionView(id=${pub.id})}" class="text-decoration-none text-dark"
                           th:text="${pub.titulo}">
                            Título de la Publicación
                        </a>
                    </h3>

                    <div class="vehicle-meta">
                        <div class="vehicle-location">
                            <i class="ri-map-pin-line"></i>
                            <span th:text="${pub.idDepartamento.nombre + ', ' + pub.idMunicipio.nombre}">
                        Departamento, Municipio
                    </span>
                        </div>
                    </div>

                    <div class="vehicle-footer">
                        <div class="vehicle-owner">
                            <div class="owner-avatar">
                                <img th:src="${#strings.isEmpty(pub.usuario.foto) ? '/images/usuarios/default_user_img.jpg' : pub.usuario.foto}"
                                     th:alt="${pub.usuario.nombre}">

                            </div>
                            <div class="owner-info">
                                <div class="owner-name" th:text="${pub.usuario.nombre}">
                                    Nombre del Propietario
                                </div>
                                <div class="owner-rating">
                                    <i class="ri-star-fill"></i>
                                    <i class="ri-star-fill"></i>
                                    <i class="ri-star-fill"></i>
                                    <i class="ri-star-line"></i>
                                </div>
                            </div>
                        </div>
                        <div class="vehicle-pricing">

                            <a th:if="${session.usuario != null}"
                               th:href="@{/chat/con/{id}(id=${pub.usuario.id})}"
                               class="btn btn-sm btn-primary w-100 mb-2 py-2">
                                <i class="ri-message-2-line me-2"></i>Contactar
                            </a>

                            <button th:if="${session.usuario == null}"
                                    type="button"
                                    class="btn btn-sm btn-primary w-100 mb-2 py-2"
                                    data-bs-toggle="modal"
                                    data-bs-target="#loginModal">
                                <i class="ri-message-2-line me-2"></i>Contactar
                            </button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
