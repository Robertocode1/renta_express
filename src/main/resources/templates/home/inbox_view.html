<div th:fragment="content" class="container-fluid px-4 px-md-5 py-4">

    <div class="row">

        <div class="col-12 col-md-4">
            <h2 class="fw-bold mb-4">Mi Bandeja de Entrada</h2>

            <div class="list-group shadow-sm" id="inbox-lista">

                <div th:if="${#lists.isEmpty(conversaciones)}"
                     class="list-group-item p-4">
                    <h5 class="mb-1">¡Todo tranquilo!</h5>
                    <p class="mb-0 text-muted">Aún no tienes conversaciones.</p>
                </div>

                <div th:each="conv : ${conversaciones}"
                     th:with="otroUsuario = (${conv.remitente.id == miUsuario.id} ? ${conv.destinatario} : ${conv.remitente})"
                     class="list-group-item list-group-item-action p-3 inbox-item"
                     th:data-usuario-id="${otroUsuario.id}"
                     th:data-usuario-nombre="${otroUsuario.nombre}"
                     th:data-usuario-foto="${otroUsuario.foto != null ? otroUsuario.foto : '/images/usuarios/default_user_img.jpg'}"
                     style="cursor: pointer;">

                    <div class="d-flex w-100 align-items-center">
                        <img th:src="${otroUsuario.foto != null ? otroUsuario.foto : '/images/usuarios/default_user_img.jpg'}"
                             alt="Avatar" class="rounded-circle me-3"
                             style="width: 50px; height: 50px; object-fit: cover;">

                        <div class="flex-grow-1 overflow-hidden">
                            <h5 class="mb-1 fw-bold text-truncate" th:text="${otroUsuario.nombre}">Nombre Usuario</h5>
                            <p class="mb-0 text-muted text-truncate">
                                <span th:if="${conv.remitente.id == miUsuario.id}" class="text-primary fw-bold">Tú: </span>
                                <span th:text="${conv.contenido}">Contenido...</span>
                            </p>
                        </div>
                        <small class="text-nowrap" th:text="${#temporals.format(conv.timestamp, 'HH:mm a')}">10:30 AM</small>
                    </div>
                </div> </div>
        </div>

        <div class="col-12 col-md-8">

            <div class="card shadow-sm border-0 d-none" id="chat-window-container" style="height: 80vh; display: flex; flex-direction: column;">

                <div class="card-header bg-white p-3 border-bottom">
                    <div class="d-flex align-items-center">
                        <img src="/images/usuarios/default_user_img.jpg"
                             alt="Avatar"
                             class="rounded-circle me-3"
                             id="chat-header-foto"
                             style="width: 40px; height: 40px; object-fit: cover;">
                        <h5 class="mb-0 fw-bold" id="chat-header-nombre">Selecciona un chat</h5>
                    </div>
                </div>

                <div class="card-body p-3 p-md-4 d-flex flex-column gap-3 overflow-auto" id="caja-de-chat">
                </div>

                <div class="card-footer bg-light p-3 border-top">
                    <form id="formulario-chat" class="input-group">
                        <input type="text" id="input-mensaje" class="form-control form-control-lg border-0"
                               placeholder="Escribe tu mensaje aquí..." autocomplete="off" style="box-shadow: none;" disabled>
                        <button class="btn btn-primary" type="submit" id="boton-enviar" disabled>
                            <i class="ri-send-plane-fill"></i>
                        </button>
                    </form>
                </div>

            </div> <div class="d-flex h-100 align-items-center justify-content-center text-muted" id="chat-placeholder">
            <h4 class="fw-light">Selecciona una conversación para empezar a chatear.</h4>
        </div>

        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/

        // Esto crea la variable global que tu script necesita
        const miIdDeUsuario = [[${session.usuario.id}]];

        /*]]>*/
    </script>

    <style>
        .chat-bubble-recibido {
            background-color: #f1f3f5; color: #212529;
            padding: 0.75rem 1rem; border-radius: 1rem;
            border-top-left-radius: 0.25rem; max-width: 75%;
            word-wrap: break-word;
        }
        .chat-bubble-enviado {
            background-color: var(--bs-primary); color: white;
            padding: 0.75rem 1rem; border-radius: 1rem;
            border-top-right-radius: 0.25rem; max-width: 75%;
            word-wrap: break-word;
        }
    </style>

</div>
