<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Federo&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4 rounded-4" style="max-width: 400px; width: 100%;">
        <h2 class="text-center mb-4 fw-bold">Iniciar sesión</h2>
        <form th:action="@{/usuario/login}" method="post">
            <!-- Usuario -->
            <div class="mb-3">
                <label for="username" class="form-label">Usuario o correo</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Tu usuario o correo">
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="********">
            </div>

            <!-- Recordarme -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                <label class="form-check-label" for="remember-me">
                    Recuérdame
                </label>
            </div>

            <!-- Botón -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </div>
        </form>

        <!-- Mensaje de error -->
        <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
            Usuario o contraseña incorrectos.
        </div>

        <!-- Registro -->
        <div class="text-center mt-3">
            <small>¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a></small>
        </div>
    </div>
</div>
<div id="toast-container" class="toast-container position-fixed top-0 start-50 trasnlate-middle-x p-3"
     style="z-index: 1111; display: none; width: 40%"></div>
<input type="hidden" id="tipo-toast" th:value="${tipo}"/>
<input type="hidden" id="mensaje-toast" th:value="${mensaje}"/>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{js/toast.js}"></script>

</body>
</html>
