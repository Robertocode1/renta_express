<div th:fragment="content" class="container-fluid px-4 py-4">
    <section class="content">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 py-3">
                <h2 class="h4 mb-0 text-dark">Gestión de Usuarios</h2>
            </div>
            <div class="card-body">
                <!-- Botón con estilos consistentes -->
                <button class="btn btn-primary mb-4" data-bs-toggle="modal" data-bs-target="#agregarModal">
                    <i class="fa-solid fa-circle-plus me-2"></i>Agregar usuario
                </button>

                <div class="table-responsive">
                    <table id="tbl" class="table table-striped table-hover" width="100%" cellspacing="0">
                        <thead class="table-light">
                        <tr>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Documento</th>
                            <th>Fecha de reg.</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th width="120">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.usuario}"></td>
                            <td th:text="${u.nombre}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.documento}"></td>
                            <td th:text="${#temporals.format(u.fechaCreacion, 'dd/MM/yyyy')}"></td>
                            <td th:text="${u.rol.nombre}"></td>
                            <td>
                                    <span th:class="${u.estado.nombre == 'Activo'} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${u.estado.nombre}">
                                    </span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <!-- Botón Contraseña -->
                                    <button type="button" class="btn btn-outline-secondary"
                                            data-bs-toggle="modal" data-bs-target="#cambiarContrasenaModal"
                                            th:attr="data-user-id=${u.id}"
                                            title="Reasignar contraseña">
                                        <i class="fa-solid fa-lock"></i>
                                    </button>

                                    <!-- Botón Editar -->
                                    <button type="button" class="btn btn-outline-primary"
                                            data-bs-toggle="modal" data-bs-target="#modificarModal"
                                            th:attr="onclick=|setEditId(${u.id})|"
                                            title="Modificar registro">
                                        <i class="fa-solid fa-edit"></i>
                                    </button>

                                    <!-- Botón Eliminar -->
                                    <button type="button" class="btn btn-outline-danger"
                                            data-bs-toggle="modal" data-bs-target="#eliminarModal"
                                            th:attr="data-user-id=${u.id}"
                                            title="Eliminar registro">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
